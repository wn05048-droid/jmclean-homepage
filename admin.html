<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMclean 관리자 로그인</title><style>body{font:16px sans-serif;background:#f3f5f8;margin:0;display:grid;place-items:center;min-height:100vh}.panel{background:white;border-radius:12px;padding:35px;width:min(420px,90%);box-shadow:0 8px 35px #0001}input,button{display:block;box-sizing:border-box;width:100%;padding:13px;margin:12px 0;border-radius:5px;border:1px solid #ccc}button{background:#172b45;color:white;cursor:pointer}#msg{color:#a32}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="cms-config.js"></script></head><body><div class="panel"><h1>JMclean 관리자 로그인</h1><p>승인된 관리자만 홈페이지를 수정할 수 있습니다.</p><form id="login"><input id="email" type="email" placeholder="관리자 이메일" autocomplete="username" required><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required><button>로그인</button></form><p id="msg"></p><a href="index.html">홈페이지로 돌아가기</a></div><script>window.addEventListener('load',()=>{const c=window.JMCMS_CONFIG||{},msg=document.getElementById('msg');if(!c.url||!c.publishableKey){msg.textContent='아직 관리자 서버 연결 설정이 완료되지 않았습니다.';return;}const db=window.supabase.createClient(c.url,c.publishableKey);document.getElementById('login').onsubmit=async e=>{e.preventDefault();msg.textContent='확인 중…';const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent='로그인 실패. 계정 정보를 확인하세요.';return;}const {data:admin,error:ae}=await db.from('site_admins').select('user_id').eq('user_id',data.user.id).maybeSingle();if(ae||!admin){await db.auth.signOut();msg.textContent='관리자 권한이 없는 계정입니다.';return;}location.href='index.html?edit=1';};});</script></body></html>
